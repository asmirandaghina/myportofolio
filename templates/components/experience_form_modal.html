<div id="experience-modal"
     class="lakon-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="experience-modal-title">
    <button type="button"
            class="lakon-form-modal__backdrop"
            popovertarget="experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form pengalaman"></button>

    <div class="lakon-form-modal__content">
        <button type="button"
                class="lakon-form-modal__close"
                popovertarget="experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form pengalaman">x</button>

        <h2 id="experience-modal-title">Tambah Pengalaman</h2>
        <form id="experience-form" class="lakon-form">
            <div class="form-group">
                <label for="exp-title">Judul</label>
                <input type="text" id="exp-title" name="title" maxlength="255" placeholder="Asisten Dosen PBP">
            </div>
            <div class="form-group">
                <label for="exp-category">Kategori</label>
                <select id="exp-category" name="category">
                    {% for value, label in category_choices %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="exp-period">Periode</label>
                <input type="text" id="exp-period" name="period_label" maxlength="50" placeholder="2022 - 2025">
            </div>
            <div class="form-group">
                <label for="exp-thumbnail">URL Gambar (opsional)</label>
                <input type="url" id="exp-thumbnail" name="thumbnail" placeholder="https://example.com/gambar.png">
            </div>
            <div class="form-group">
                <label for="exp-description">Deskripsi</label>
                <textarea id="exp-description" name="description" rows="4"></textarea>
            </div>
            <div class="lakon-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="experience-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button" id="experience-submit">Tambah</button>
            </div>
        </form>
    </div>
</div>
