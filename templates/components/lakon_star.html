<form method="post" action="{% url 'main:toggle_star' lakon.id %}">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in lakon.starred_by.all %} is-starred{% endif %}"
            title="{% if lakon.starred_by.all %}Dibintangi oleh {{ lakon.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in lakon.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ lakon.starred_by.count }}</span>
    </button>
</form>
