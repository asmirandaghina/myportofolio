<div id="add-lakon-modal"
     class="lakon-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-lakon-modal-title">
     <button type="button"
             class="lakon-form-modal__backdrop"
             popovertarget="add-lakon-modal"
             popovertargetaction="hide"
             aria-label="Tutup form tambah lakon"></button>
    
    <div class="lakon-form-modal__content">
        <button type="button"
                class="lakon-form-modal__close"
                popovertarget="add-lakon-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah lakon">x</button>
        
        <h2 id="add-lakon-modal-title">Tambah Lakon Baru</h2>
        <form id="lakon-form"
              method="post"
              action="{% url 'main:create_lakon' %}"
              class="lakon-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label}}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="lakon-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-lakon-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Lakon</button>
            </div>
        </form>
    </div>
</div>
